[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lead-crawler"
version = "0.1.0"
description = "Tinasoft Phase 1 - standalone B2B lead collection, normalization, filtering, deduplication and export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The browser-backed sources (``apollo``, ``website``) need this extra. It is
# optional so ``--source csv``/``--source mock`` keep working on a machine with
# no Chromium; ``src/browser/cloak.py`` imports both lazily and reports a clear
# message when they are missing.
browser = [
    "cloakbrowser>=0.5.12",
    # Declared explicitly rather than relied on transitively: ``src/browser``
    # imports ``playwright`` directly, so it is a first-class dependency here.
    "playwright>=1.40",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
lead-crawler = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Real-browser tiers are excluded by default: the socket guard in
# ``tests/conftest.py`` patches this process, and Chromium is a child process
# with its own sockets, so the guard cannot contain it. Opt in explicitly with
# ``-m browser_integration`` (which still additionally requires
# ``LEAD_TEST_REAL_BROWSER=1``).
addopts = "-q --strict-markers -m 'not browser_integration and not capture_pages'"
filterwarnings = ["error::DeprecationWarning:src.*"]
markers = [
    "allow_network: opt a single test out of the suite-wide network ban (see tests/conftest.py)",
    "browser_integration: launch real Chromium with all requests served from local snapshots (offline)",
    "capture_pages: refresh HTML snapshots from the live web (manual only)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
# ``tests/`` is a package (it has an ``__init__.py``), so ``tests.conftest``
# must resolve from the repository root rather than as a stray top-level module.
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ``cloakbrowser`` ships no ``py.typed`` marker, so its own annotations are
# invisible to mypy. Everything this project *does* with it is annotated at the
# ``src/browser/cloak.py`` boundary, which is the only place it is imported.
[[tool.mypy.overrides]]
module = ["cloakbrowser", "cloakbrowser.*"]
ignore_missing_imports = true
